<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Platform — EvE Waste</title>
  <meta name="description" content="The About page has moved. The EvE Waste founding story and values now live on the Platform page.">

  <!-- The About page was retired on 2026-09-03; its founding story and the three
       values moved to platform.html#why and platform.html#values. This stub is kept
       so the old URL keeps working for anything already linking to it — inbound
       links, the LinkedIn profile, printed material. _redirects issues a real 301
       on Cloudflare Pages; this page is the fallback if that ever stops matching.
       It carries noindex plus a canonical to the Platform page so the two are
       never treated as duplicate content. Safe to delete once nothing links here. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://evewaste.com/platform.html">
  <meta http-equiv="refresh" content="0; url=platform.html">

  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#15342D">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/theme.css?v=cccd288b">
  <link rel="stylesheet" href="css/styles.css?v=eb3f79ee">
</head>
<body>
  <main id="main" tabindex="-1">
    <section class="section text-center">
      <div class="container container--narrow">
        <h1 class="section__title">This page has moved</h1>
        <p class="section__lead">Why we build EvE Waste, and what we hold to, now live on the Platform page.</p>
        <p><a class="btn btn--primary btn--lg" href="platform.html">Go to the Platform page</a></p>
      </div>
    </section>
  </main>
</body>
</html>
